services:

  # Serveur web du backend Symfony
  nginx:
    image: nginx:alpine
    container_name: quaiantique_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # Application Symfony
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quaiantique_php
    working_dir: /var/www/html
    environment:
      DATABASE_URL: "mysql://root:root@database:3306/quai_antique?serverVersion=8.0.46&charset=utf8mb4"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DB: "symfony"
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      - database
      - mongodb

  # Frontend Vite construit puis servi par Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quaiantique_frontend
    ports:
      - "5173:80"
    depends_on:
      - nginx

  # Base de données MySQL
  database:
    image: mysql:8.0
    container_name: quaiantique_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quai_antique
      MYSQL_USER: quai_antique
      MYSQL_PASSWORD: quai_antique
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3307:3306"

  # Base de données MongoDB
  mongodb:
    image: mongo:8
    container_name: quaiantique_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

volumes:
  database_data:
  mongodb_data:
  vendor_data: