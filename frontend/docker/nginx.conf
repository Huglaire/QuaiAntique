# Serveur web du frontend SPA
server {
    listen 80;
    server_name localhost;

    # Répertoire contenant le build Vite
    root /usr/share/nginx/html;
    index index.html;

    # Transmission des appels API vers le backend Symfony
    location /api/ {
        proxy_pass http://nginx:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Transmission des images du backend vers le frontend
    location /uploads/ {
        proxy_pass http://nginx:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestion du routage SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Désactivation de la mise en cache de index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
