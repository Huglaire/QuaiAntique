# Serveur web du frontend SPA
server {
    listen 80;
    server_name localhost;

    # Répertoire contenant le build Vite
    root /usr/share/nginx/html;
    index index.html;

    # Gestion du routage SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Désactivation de la mise en cache de index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}