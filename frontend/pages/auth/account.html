<section class="page-hero">
    <h1>Mon compte</h1>
</section>

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h2 class="text-primary">
                            Mes informations
                        </h2>

                        <p class="mb-0">
                            Retrouvez ici les informations de votre compte.
                        </p>
                    </div>

                    <div
                        id="account-error"
                        class="alert alert-danger d-none"
                        role="alert"
                    ></div>

                    <dl class="row mb-4">

                        <dt class="col-sm-5">
                            Prénom
                        </dt>

                        <dd
                            id="account-first-name"
                            class="col-sm-7"
                        ></dd>

                        <dt class="col-sm-5">
                            Nom
                        </dt>

                        <dd
                            id="account-last-name"
                            class="col-sm-7"
                        ></dd>

                        <dt class="col-sm-5">
                            Adresse e-mail
                        </dt>

                        <dd
                            id="account-email"
                            class="col-sm-7"
                        ></dd>

                        <dt class="col-sm-5">
                            Nombre de personnes
                        </dt>

                        <dd
                            id="account-guest-number"
                            class="col-sm-7"
                        ></dd>

                        <dt class="col-sm-5">
                            Allergies
                        </dt>

                        <dd
                            id="account-allergy"
                            class="col-sm-7"
                        ></dd>

                    </dl>

                    <div class="d-grid gap-2">

                        <a
                            href="/"
                            class="btn btn-primary"
                        >
                            Retour à l'accueil
                        </a>

                    </div>

                </div>
            </div>

        </div>
    </div>
</section>
