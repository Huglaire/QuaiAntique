<section class="page-hero">
    <h1>Mon compte</h1>
</section>

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h2 class="text-primary">
                            Mes informations
                        </h2>

                        <p class="mb-0">
                            Consultez et modifiez les informations
                            de votre compte.
                        </p>
                    </div>

                    <div
                        id="account-error"
                        class="alert alert-danger d-none"
                        role="alert"
                    ></div>

                    <div
                        id="account-success"
                        class="alert alert-success d-none"
                        role="alert"
                    ></div>

                    <form id="account-form" novalidate>

                        <div class="row">

                            <div class="col-12 col-md-6 mb-3">
                                <label
                                    for="account-first-name"
                                    class="form-label"
                                >
                                    Prénom
                                </label>

                                <input
                                    id="account-first-name"
                                    name="firstName"
                                    type="text"
                                    class="form-control"
                                    autocomplete="given-name"
                                    required
                                >
                            </div>

                            <div class="col-12 col-md-6 mb-3">
                                <label
                                    for="account-last-name"
                                    class="form-label"
                                >
                                    Nom
                                </label>

                                <input
                                    id="account-last-name"
                                    name="lastName"
                                    type="text"
                                    class="form-control"
                                    autocomplete="family-name"
                                    required
                                >
                            </div>

                            <div class="col-12 mb-3">
                                <label
                                    for="account-email"
                                    class="form-label"
                                >
                                    Adresse e-mail
                                </label>

                                <input
                                    id="account-email"
                                    name="email"
                                    type="email"
                                    class="form-control"
                                    autocomplete="email"
                                    required
                                >
                            </div>

                            <div class="col-12 col-md-6 mb-3">
                                <label
                                    for="account-guest-number"
                                    class="form-label"
                                >
                                    Nombre de personnes
                                </label>

                                <input
                                    id="account-guest-number"
                                    name="guestNumber"
                                    type="number"
                                    class="form-control"
                                    min="1"
                                    max="50"
                                    required
                                >
                            </div>

                            <div class="col-12 mb-4">
                                <label
                                    for="account-allergy"
                                    class="form-label"
                                >
                                    Allergies ou informations alimentaires
                                </label>

                                <textarea
                                    id="account-allergy"
                                    name="allergy"
                                    class="form-control"
                                    rows="3"
                                ></textarea>
                            </div>

                        </div>

                        <div class="d-grid">
                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Enregistrer les modifications
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center">
                        <h2 class="text-primary">
                            Gestion du compte
                        </h2>

                        <p class="mb-4">
                            Gérez les paramètres de sécurité de votre compte.
                        </p>

                        <div class="d-grid gap-2">
                            <a
                                href="/compte/mot-de-passe"
                                class="btn btn-outline-primary"
                            >
                                Modifier mon mot de passe
                            </a>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</section>
