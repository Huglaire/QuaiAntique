<section class="page-hero">
    <h1>Inscription</h1>
</section>

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h2 class="text-primary">
                            Créer votre compte
                        </h2>

                        <p class="mb-0">
                            Créez votre compte pour pouvoir réserver
                            une table au Quai Antique.
                        </p>
                    </div>

                    <form id="signup-form" novalidate>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label
                                    for="firstName"
                                    class="form-label"
                                >
                                    Prénom
                                </label>

                                <input
                                    id="firstName"
                                    name="firstName"
                                    type="text"
                                    class="form-control"
                                    autocomplete="given-name"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label
                                    for="lastName"
                                    class="form-label"
                                >
                                    Nom
                                </label>

                                <input
                                    id="lastName"
                                    name="lastName"
                                    type="text"
                                    class="form-control"
                                    autocomplete="family-name"
                                    required
                                >
                            </div>

                        </div>

                        <div class="mb-3">
                            <label
                                for="email"
                                class="form-label"
                            >
                                Adresse e-mail
                            </label>

                            <input
                                id="email"
                                name="email"
                                type="email"
                                class="form-control"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="password"
                                class="form-label"
                            >
                                Mot de passe
                            </label>

                            <input
                                id="password"
                                name="password"
                                type="password"
                                class="form-control"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="confirmPassword"
                                class="form-label"
                            >
                                Confirmer le mot de passe
                            </label>

                            <input
                                id="confirmPassword"
                                name="confirmPassword"
                                type="password"
                                class="form-control"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="guestNumber"
                                class="form-label"
                            >
                                Nombre de personnes par défaut
                            </label>

                            <input
                                id="guestNumber"
                                name="guestNumber"
                                type="number"
                                class="form-control"
                                min="1"
                                max="50"
                                value="2"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label
                                for="allergy"
                                class="form-label"
                            >
                                Allergies ou restrictions alimentaires
                            </label>

                            <textarea
                                id="allergy"
                                name="allergy"
                                class="form-control"
                                rows="3"
                                placeholder="Facultatif"
                            ></textarea>
                        </div>

                        <div
                            id="signup-error"
                            class="alert alert-danger d-none"
                            role="alert"
                        ></div>

                        <div
                            id="signup-success"
                            class="alert alert-success d-none"
                            role="alert"
                        ></div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Créer mon compte
                        </button>

                    </form>

                    <p class="text-center mt-4 mb-0">
                        Vous avez déjà un compte ?
                        <a href="/connexion">
                            Se connecter
                        </a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</section>
